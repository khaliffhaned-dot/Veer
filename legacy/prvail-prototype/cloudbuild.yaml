steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/prvail-app:$COMMIT_SHA', '.']

  # 2. Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/prvail-app:$COMMIT_SHA']

  # 3. Deploy the container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'prvail-app' # This is the service name
      - '--image=gcr.io/$PROJECT_ID/prvail-app:$COMMIT_SHA'
      - '--region=us-central1' # Specify your desired region
      - '--platform=managed'
      - '--allow-unauthenticated' # Allows public access to the service
      - '--quiet'
      # NOTE: For a real deployment, manage secrets like API_KEY using Google Secret Manager.
      # Example: --set-secrets=API_KEY=prvail-api-key:latest

# Store the image in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/prvail-app:$COMMIT_SHA'
